<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>tts.pdf</title>
  <meta name="description" content="Drop a PDF and it is read aloud, in your browser." />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='3' y='1' width='10' height='14' fill='white' stroke='%231c1f26'/><rect x='5' y='6' width='6' height='3' fill='%23ffe94e'/></svg>"
  />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap"
  />
  <style>
    :root {
      --desk: #c6c9cc;
      --paper: #fdfdfb;
      --ink: #1c1f26;
      --faint: #6d727c;
      --marker: #ffe94e;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      height: 100%;
      margin: 0;
    }
    body {
      display: grid;
      place-items: center;
      background: var(--desk);
      color: var(--ink);
      font:
        400 1.0625rem/1.65 Literata,
        Georgia,
        serif;
    }

    .sheet {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      height: calc(100dvh - 3rem);
      aspect-ratio: 1 / 1.414;
      max-width: calc(100vw - 1.5rem);
      padding: clamp(1.5rem, 6vmin, 4rem);
      background: var(--paper);
      box-shadow:
        0 1px 1px rgb(28 31 38 / 0.25),
        0 12px 28px -14px rgb(28 31 38 / 0.45);
    }
    /* paper grain */
    .sheet::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.5;
      mix-blend-mode: multiply;
      background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .22 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
    }
    .over .sheet {
      outline: 2px dashed var(--ink);
      outline-offset: -1rem;
    }

    .head,
    .foot {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.5rem 1.5rem;
      font-size: 0.875rem;
    }
    .head {
      justify-content: space-between;
      color: var(--faint);
      font-style: italic;
    }
    .doc {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      min-width: 0;
      max-width: 75%;
    }
    #file {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #close {
      font-style: normal;
      font-size: 1.15rem;
      line-height: 1;
      color: var(--ink);
    }

    [hidden] {
      display: none !important;
    }
    #text {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: thin;
      text-wrap: pretty;
      hyphens: auto;
    }
    #text p {
      margin: 0 0 0.8em;
    }
    #text h2 {
      margin: 1.2em 0 0.5em;
      font:
        600 1.3em/1.25 Literata,
        Georgia,
        serif;
      hyphens: manual;
    }
    #text h2:first-child {
      margin-top: 0;
    }
    #text span {
      cursor: pointer;
    }
    #text .now {
      background: var(--marker);
      mix-blend-mode: multiply;
      padding: 0.12em 0;
      border-radius: 0.25em 0.1em;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 24rem;
    }
    .empty h1 {
      margin: 0 0 1rem;
      font:
        400 clamp(2rem, 7vmin, 3.25rem)/1.1 Literata,
        Georgia,
        serif;
      letter-spacing: -0.015em;
    }
    .empty p {
      margin: 0 0 1.5rem;
      color: var(--faint);
    }
    .empty label {
      color: var(--ink);
    }

    .foot {
      border-top: 1px solid var(--ink);
      padding-top: 0.75rem;
    }
    .foot .folio {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
    }
    #status {
      flex-basis: 100%;
      min-height: 1.4em;
      color: var(--faint);
      font-style: italic;
    }
    button,
    select,
    label[for] {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--ink);
      border-radius: 0;
      padding: 0 0.1em;
      cursor: pointer;
    }
    button:hover:enabled,
    select:hover:enabled,
    label[for]:hover {
      background: var(--marker);
    }
    :disabled {
      opacity: 0.4;
      cursor: default;
    }
    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    input[type='range'] {
      width: 5.5rem;
      accent-color: var(--ink);
      vertical-align: middle;
    }
    output {
      display: inline-block;
      min-width: 2.6em;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 34rem) {
      .sheet {
        height: 100dvh;
        max-width: 100vw;
        box-shadow: none;
      }
    }
  </style>

  <main class="sheet">
    <div class="head">
      <span>tts.pdf</span>
      <span class="doc">
        <span id="file"></span>
        <button id="close" hidden aria-label="Close this PDF" title="Close this PDF">×</button>
      </span>
    </div>

    <section id="empty" class="empty">
      <h1>Drop a PDF on this page</h1>
      <p>
        It is read aloud by a voice that runs in your browser. The file never leaves your device.
      </p>
      <p>
        <label for="pick" tabindex="0">Choose a file</label>
        <input id="pick" type="file" accept="application/pdf,.pdf" hidden />
      </p>
    </section>
    <article id="text" hidden></article>

    <div class="foot">
      <span id="status" role="status"></span>
      <button id="play" disabled>Play</button>
      <button id="stop" disabled>Stop</button>
      <span>
        <button id="slower" aria-label="Slower">−</button>
        <output id="rate">1.2×</output>
        <button id="faster" aria-label="Faster">+</button>
      </span>
      <label>
        Volume
        <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" />
      </label>
      <select id="lang" aria-label="Language">
        <option value="">Auto</option>
      </select>
      <span class="folio">
        <button id="prev" disabled aria-label="Previous page">‹</button>
        <span id="folio">–</span>
        <button id="next" disabled aria-label="Next page">›</button>
      </span>
    </div>
  </main>

  <!-- bundling CDNs break the wasm loaders, hence raw files and this import map; its sha256 is pinned in vercel.json -->
  <script type="importmap">
    {
      "imports": {
        "onnxruntime-web/wasm": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.18.0/dist/esm/ort.wasm.min.js"
      }
    }
  </script>
  <script type="module" src="tts.js"></script>
</html>
